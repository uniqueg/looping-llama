version: "3.8"

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy-server
    restart: unless-stopped
    command:
      - serve
      - --config=/etc/ntfy/server.yml
    ports:
      - "8080:80"
    volumes:
      - /volume1/docker/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - /volume1/docker/ntfy/cache:/var/cache/ntfy
      - /volume1/docker/ntfy/data:/var/lib/ntfy
    environment:
      - TZ=Europe/Zurich
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
