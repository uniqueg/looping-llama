version: "3.8"

services:
  openbao:
    image: openbao/openbao:latest
    container_name: openbao-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - /volume1/docker/openbao/config/bao.hcl:/openbao/config/bao.hcl:ro
      - /volume1/docker/openbao/data:/openbao/data:rw
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
      - TZ=Europe/Zurich
    command: server -config=/openbao/config/bao.hcl
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
